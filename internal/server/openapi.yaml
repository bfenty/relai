  # ── Model Mappings ─────────────────────────────────────────────────────────

  /api/model-mappings:
    get:
      summary: List model mappings
      tags: [Model Mappings]
      responses:
        "200":
          description: All model mappings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelMap' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create model mapping
      description: |
        Maps a `local_model` name (what clients send) to a `remote_model` name
        on a specific backend.
      tags: [Model Mappings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backend_id, remote_model, local_model]
              properties:
                backend_id:              { type: integer }
                remote_model:            { type: string }
                local_model:             { type: string }
                model_type:              { type: string, enum: [chat, embedding, rerank] }
                input_cost_per_million:  { type: number, default: 0 }
                output_cost_per_million: { type: number, default: 0 }
                status:                  { type: string, enum: [active, inactive] }
      responses:
        "201":
          description: Created mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelMap' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/model-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get model mapping
      tags: [Model Mappings]
      responses:
        "200":
          description: Model mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelMap' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update model mapping
      tags: [Model Mappings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelMap' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Delete model mapping
      tags: [Model Mappings]
      responses:
        "200": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/model-mappings/{id}/health:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Health check model mapping
      tags: [Model Mappings]
      responses:
        "200":
          description: Health check result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelMap' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Virtual Routers ────────────────────────────────────────────────────────

  /api/routers:
    get:
      summary: List virtual routers
