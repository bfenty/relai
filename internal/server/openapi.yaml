openapi: "3.1.0"
info:
  title: Relai API
  description: |
    Relai is an LLM proxy and gateway. It exposes an OpenAI-compatible inference API
    and an admin API for managing backends, API keys, routing rules, model mappings,
    virtual routers, MCP servers, and users.

    **Authentication**

    | Endpoint group | Accepted credentials |
    |---|---|
    | `/v1/*`, `/v2/*`, `/mcp` | `Authorization: Bearer <api_key>` (DB-managed key, prefix `rlai_`) |
    | Admin `/api/*`   | `Authorization: Bearer <admin_key>` (env) or `relai_session` cookie |

    Admin API keys (bearer tokens) are managed at `/api/keys`.
    User-facing inference keys are also managed there and carry per-key scopes,
    rate limits, and allowed-backend/model restrictions.
  version: "1.0.0"

servers:
  - url: /
    description: Same-origin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "`rlai_` prefixed API key for inference endpoints, or admin key for /api/*"
    AdminCookieAuth:
      type: apiKey
      in: cookie
      name: relai_session
      description: Session cookie from POST /api/auth/login

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    Backend:
      type: object
      properties:
        id:                { type: integer }
        name:              { type: string }
        base_url:          { type: string, format: uri }
        api_key:           { type: string, description: "Omitted in list responses" }
        weight:            { type: integer, default: 1 }
        status:            { type: string, enum: [active, inactive, error] }
        color:             { type: string, example: "#3b82f6" }
        last_latency_ms:   { type: integer }
        last_health_check: { type: string, format: date-time, nullable: true }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }

    BackendInput:
      type: object
      required: [name, base_url]
      properties:
        name:    { type: string }
        base_url: { type: string, format: uri }
        api_key: { type: string }
        weight:  { type: integer, default: 1 }
        status:  { type: string, enum: [active, inactive] }
        color:   { type: string }

    APIKey:
      type: object
      properties:
        id:                   { type: integer }
        key_prefix:           { type: string, example: "rlai_a1b2c3..." }
        name:                 { type: string }
        owner:                { type: string }
        user_id:              { type: integer, nullable: true }
        scopes:               { type: array, items: { type: string } }
        expires_at:           { type: string, format: date-time, nullable: true }
        rate_limit_rpm:       { type: integer, description: "Requests per minute; 0 = unlimited" }
        rate_limit_remaining: { type: integer }
        rate_limit_reset_at:  { type: string, format: date-time, nullable: true }
        allowed_backends:     { type: array, items: { type: integer } }
        allowed_models:       { type: array, items: { type: string } }
        is_active:            { type: boolean }
        is_test:              { type: boolean }
        last_used_at:         { type: string, format: date-time, nullable: true }
        total_cost:           { type: number }
        total_requests:       { type: integer }
        created_at:           { type: string, format: date-time }
        updated_at:           { type: string, format: date-time }

    APIKeyInput:
      type: object
      required: [name, owner]
      properties:
        name:             { type: string }
        owner:            { type: string }
        scopes:
          type: array
          items: { type: string }
          description: "Default: [inference, models:read, embeddings, rerank]"
          example: ["inference", "models:read"]
        expires_at:       { type: string, format: date-time, nullable: true }
        rate_limit_rpm:   { type: integer, default: 0 }
        user_id:          { type: integer, nullable: true }
        allowed_backends: { type: array, items: { type: integer } }
        allowed_models:   { type: array, items: { type: string } }
        is_active:        { type: boolean, default: true }
        is_test:          { type: boolean, default: false }

    RoutingRule:
      type: object
      properties:
        id:         { type: integer }
        name:       { type: string }
        strategy:   { type: string, example: "round_robin" }
        priority:   { type: integer }
        conditions: { type: object }
        config:     { type: object }
        is_active:  { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoutingRuleInput:
      type: object
      required: [name, strategy]
      properties:
        name:       { type: string }
        strategy:
          type: string
          enum: [round_robin, weighted, model_based, cost_based, latency_based]
        priority:   { type: integer, default: 0 }
        conditions: { type: object }
        config:     { type: object }
        is_active:  { type: boolean, default: true }

    ModelMap:
      type: object
      properties:
        id:                     { type: integer }
        backend_id:             { type: integer }
        remote_model:           { type: string, description: "Model name sent to the backend" }
        local_model:            { type: string, description: "Model name the client sends" }
        base_url:               { type: string }
        status:                 { type: string, enum: [active, inactive, error] }
        last_latency_ms:        { type: integer }
        last_health_check:      { type: string, format: date-time, nullable: true }
        params:                 { type: string }
        input_cost_per_million: { type: number }
        output_cost_per_million: { type: number }
        model_type:             { type: string, enum: [chat, embedding, rerank] }
        modes:                  { type: array, items: { type: string } }

    Router:
      type: object
      properties:
        id:                    { type: integer }
        name:                  { type: string }
        strategy:              { type: string, enum: [sticky, round_robin, failover] }
        cache_enabled:         { type: boolean }
        cache_ttl_seconds:     { type: integer }
        queue_timeout_seconds: { type: integer }
        created_at:            { type: string, format: date-time }
        updated_at:            { type: string, format: date-time }

    RouterInput:
      type: object
      required: [name]
      properties:
        name:                  { type: string }
        strategy:              { type: string, enum: [sticky, round_robin, failover], default: sticky }
        cache_enabled:         { type: boolean, default: false }
        cache_ttl_seconds:     { type: integer, default: 3600 }
        queue_timeout_seconds: { type: integer, default: 60 }

    RouterMember:
      type: object
      properties:
        id:           { type: integer }
        router_id:    { type: integer }
        model_map_id: { type: integer }
        priority:     { type: integer }

    MCPServer:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        url:         { type: string }
        transport:   { type: string, enum: [http, stdio] }
        api_key:     { type: string }
        description: { type: string }
        is_enabled:  { type: boolean }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    User:
      type: object
      properties:
        id:         { type: integer }
        name:       { type: string }
        email:      { type: string, format: email }
        is_active:  { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserWithStats:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            key_count:      { type: integer }
            total_requests: { type: integer }

    RequestLog:
      type: object
      properties:
        id:              { type: integer }
        api_key_id:      { type: integer, nullable: true }
        backend_id:      { type: integer, nullable: true }
        model:           { type: string }
        endpoint:        { type: string }
        request_tokens:  { type: integer }
        response_tokens: { type: integer }
        thinking_tokens: { type: integer }
        total_tokens:    { type: integer }
        cost:            { type: number }
        status_code:     { type: integer }
        latency_ms:      { type: integer }
        error_message:   { type: string }
        created_at:      { type: string, format: date-time }

    DashboardStats:
      type: object
      description: Aggregated usage statistics across all backends and API keys
      properties:
        total_requests:     { type: integer }
        total_tokens:       { type: integer }
        total_cost:         { type: number }
        error_rate:         { type: number }
        avg_latency_ms:     { type: number }
        requests_today:     { type: integer }
        backends:           { type: array, items: { type: object } }
        api_keys:           { type: array, items: { type: object } }
        models:             { type: array, items: { type: object } }

    AnalyticsCell:
      type: object
      description: Aggregated usage for a single (bucket, group) pair
      properties:
        requests: { type: integer }
        tokens:   { type: integer }
        cost:     { type: number }
        errors:   { type: integer }

    AnalyticsGroup:
      type: object
      description: Total usage for a single group across the whole range
      properties:
        key:      { type: string, description: Stable identifier (model name, or numeric id) }
        label:    { type: string, description: Human-readable display name }
        requests: { type: integer }
        tokens:   { type: integer }
        cost:     { type: number }
        errors:   { type: integer }

    AnalyticsResult:
      type: object
      description: Time-bucketed usage aggregated by a grouping dimension
      properties:
        group_by: { type: string, enum: [model, api_key, user, backend] }
        interval: { type: string, enum: [hour, day, week] }
        start:    { type: string, format: date-time }
        end:      { type: string, format: date-time }
        summary:  { $ref: '#/components/schemas/AnalyticsCell' }
        groups:
          type: array
          description: Top groups (long tail collapsed into key "__other__"), ranked by usage
          items: { $ref: '#/components/schemas/AnalyticsGroup' }
        buckets:
          type: array
          items:
            type: object
            properties:
              time: { type: string, format: date-time }
              groups:
                type: object
                additionalProperties: { $ref: '#/components/schemas/AnalyticsCell' }

    QueueEntry:
      type: object
      description: Snapshot of an in-flight proxied request
      properties:
        id:         { type: string }
        model:      { type: string }
        backend_id: { type: integer }
        started_at: { type: string, format: date-time }

    ReadinessResponse:
      type: object
      properties:
        ready:
          type: boolean
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok:      { type: boolean }
              message: { type: string }

    JSONRPCMessage:
      type: object
      description: JSON-RPC 2.0 message used by the MCP Streamable HTTP endpoint.
      additionalProperties: true
      properties:
        jsonrpc: { type: string, example: "2.0" }
        id:
          oneOf:
            - type: string
            - type: integer
            - type: "null"
        method: { type: string, example: tools/list }
        params: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        error:  { type: object, additionalProperties: true }

    # ── OpenAI-compatible types ────────────────────────────────────────────

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                description: Content parts (text, image_url, etc.)
        name:         { type: string }
        tool_calls:   { type: array, items: { type: object } }
        tool_call_id: { type: string }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model name as registered in model mappings
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatMessage' }
        stream:          { type: boolean, default: false }
        temperature:     { type: number, minimum: 0, maximum: 2 }
        top_p:           { type: number }
        max_tokens:      { type: integer }
        stop:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        presence_penalty:  { type: number }
        frequency_penalty: { type: number }
        n:                 { type: integer, default: 1 }
        tools:             { type: array, items: { type: object } }
        tool_choice:
          oneOf:
            - type: string
            - type: object

    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        encoding_format: { type: string, enum: [float, base64], default: float }

    RerankRequest:
      type: object
      required: [model, query, documents]
      properties:
        model:      { type: string }
        query:      { type: string }
        documents:  { type: array, items: { type: string } }
        top_n:      { type: integer }

  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  # ── System ─────────────────────────────────────────────────────────────────

  /health:
    get:
      summary: Liveness check
      description: Returns 200 with body "ok" when the server process is running.
      security: []
      tags: [System]
      responses:
        "200":
          description: Server is alive
          content:
            text/plain:
              schema: { type: string, example: ok }

  /ready:
    get:
      summary: Readiness check
      description: |
        Returns 200 when the server is ready to serve traffic (database connected,
        models available if `RELAI_READY_REQUIRE_MODELS=true`).
      security: []
      tags: [System]
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }
        "503":
          description: Not ready — one or more checks failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessResponse' }

  /api/openapi.yaml:
    get:
      summary: OpenAPI specification
      description: This specification in YAML format. No authentication required.
      security: []
      tags: [System]
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema: { type: string }

  /mcp:
    post:
      summary: MCP Streamable HTTP gateway
      description: |
        Accepts standard MCP JSON-RPC requests over Streamable HTTP and exposes
        all enabled HTTP MCP servers registered in Relai as a single MCP server.
        Tool and prompt names are prefixed as `<server>_<id>__<name>` to avoid
        collisions. Resource URIs are wrapped with `relai+mcp://...` so reads
        route back to the originating upstream server.
      tags: [MCP Servers]
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: { type: string, example: "2025-11-25" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JSONRPCMessage' }
      responses:
        "200":
          description: JSON-RPC response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JSONRPCMessage' }
        "202":
          description: Notification accepted
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Invalid Origin header }
    get:
      summary: MCP GET stream
      description: Relai does not expose an independent server-to-client SSE stream.
      tags: [MCP Servers]
      responses:
        "405": { description: GET streams are not supported }

  # ── Auth ───────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      summary: Log in (admin)
      description: Authenticate with username/password and receive a session cookie.
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful; `relai_session` cookie set
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429":
          description: Too many failed attempts

  /api/auth/logout:
    post:
      summary: Log out
      tags: [Auth]
      responses:
        "200": { description: Logged out }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/auth/me:
    get:
      summary: Current authenticated user
      tags: [Auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/settings/branding:
    get:
      summary: Get branding settings
      description: Public endpoint — no authentication required.
      security: []
      tags: [Settings]
      responses:
        "200":
          description: Branding configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:        { type: string }
                  logo_url:    { type: string }
                  primary_color: { type: string }
    put:
      summary: Update branding settings
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:          { type: string }
                logo_url:      { type: string }
                primary_color: { type: string }
      responses:
        "200": { description: Updated }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/settings/storage:
    get:
      summary: Storage diagnostics
      tags: [Settings]
      responses:
        "200":
          description: Storage stats (DB sizes, row counts, etc.)
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── OpenAI-compatible inference ────────────────────────────────────────────

  /v1/chat/completions:
    post:
      summary: Chat completions
      description: |
        OpenAI-compatible chat completion endpoint. Relai proxies the request
        to the selected backend after applying routing rules and model mappings.
        Set `stream: true` for Server-Sent Events streaming.
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        "200":
          description: |
            Chat completion result. When `stream: true`, the response body is an
            SSE stream of `data: {...}` lines ending with `data: [DONE]`.
          content:
            application/json:
              schema: { type: object, description: "OpenAI ChatCompletion object" }
            text/event-stream:
              schema: { type: string, description: "SSE stream of ChatCompletionChunk objects" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "429":
          description: Rate limit exceeded

  /v1/completions:
    post:
      summary: Text completions (legacy)
      description: Legacy completion endpoint, proxied to the backend unchanged.
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Completion result
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/embeddings:
    post:
      summary: Generate embeddings
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingRequest' }
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object:    { type: string, example: embedding }
                        index:     { type: integer }
                        embedding: { type: array, items: { type: number } }
                  model: { type: string }
                  usage: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v2/embed:
    post:
      summary: Generate embeddings (v2 alias)
      description: Same as POST /v1/embeddings.
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmbeddingRequest' }
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/rerank:
    post:
      summary: Rerank documents
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RerankRequest' }
      responses:
        "200":
          description: Reranking scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index:           { type: integer }
                        relevance_score: { type: number }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v2/rerank:
    post:
      summary: Rerank documents (v2 alias)
      description: Same as POST /v1/rerank.
      security:
        - BearerAuth: []
      tags: [Inference]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RerankRequest' }
      responses:
        "200":
          description: Reranking scores
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/models:
    get:
      summary: List available models
      description: Returns models derived from active model mappings.
      security:
        - BearerAuth: []
      tags: [Inference]
      responses:
        "200":
          description: Model list (OpenAI format)
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string }
                        object:     { type: string, example: model }
                        created:    { type: integer }
                        owned_by:   { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /v1/models/{model}:
    parameters:
      - name: model
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get model details
      security:
        - BearerAuth: []
      tags: [Inference]
      responses:
        "200":
          description: Model object
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }

  # ── Dashboard ──────────────────────────────────────────────────────────────

  /api/dashboard/stats:
    get:
      summary: Aggregated usage statistics
      tags: [Dashboard]
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/dashboard/stream:
    get:
      summary: Live stat delta stream (SSE)
      description: |
        Server-Sent Events stream of request completion events. Each event carries
        delta statistics suitable for updating a live dashboard.
        Query `?errors=true` to receive only error events.
      tags: [Dashboard]
      parameters:
        - name: errors
          in: query
          schema: { type: boolean, default: false }
          description: If true, only error events are streamed
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/analytics/usage:
    get:
      summary: Time-bucketed usage analytics
      description: |
        Aggregates request logs into time buckets over a date range, grouped by a
        chosen dimension. Powers the Analytics screen's stacked bar chart and
        drill-down table. Labels for keys, users, and hosts are resolved from the
        app database, so this works whether request logs are stored in SQLite or
        PostgreSQL.
      tags: [Dashboard]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 start of the range (defaults to 7 days ago)
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: RFC3339 end of the range (defaults to now)
        - name: group_by
          in: query
          schema: { type: string, enum: [model, api_key, user, backend], default: model }
          description: Dimension to group (stack) usage by
        - name: interval
          in: query
          schema: { type: string, enum: [hour, day, week] }
          description: Bucket size. Omit to auto-select from the range span.
      responses:
        "200":
          description: Aggregated usage analytics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/queue:
    get:
      summary: In-flight request queue snapshot
      description: Returns metadata (no bodies) about requests currently being proxied.
      tags: [Dashboard]
      responses:
        "200":
          description: Queue snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: array
                    items: { $ref: '#/components/schemas/QueueEntry' }
                  count: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

