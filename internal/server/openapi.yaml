        Virtual routers provide named, addressable model endpoints. Clients
        address them by the router name as the model (e.g. `model: "gpt4-router"`).
      tags: [Virtual Routers]
      responses:
        "200":
          description: All virtual routers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Router' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create virtual router
      tags: [Virtual Routers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterInput' }
      responses:
        "201":
          description: Created router
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/routers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get virtual router
      tags: [Virtual Routers]
      responses:
        "200":
          description: Virtual router
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update virtual router
      tags: [Virtual Routers]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouterInput' }
      responses:
        "200":
          description: Updated router
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Router' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Delete virtual router
      tags: [Virtual Routers]
      responses:
        "200": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/routers/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List router members (model mappings)
      tags: [Virtual Routers]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RouterMember' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Add member to router
      tags: [Virtual Routers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_map_id]
              properties:
                model_map_id: { type: integer }
                priority:     { type: integer, default: 0 }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouterMember' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/routers/{id}/members/{memberID}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
      - name: memberID
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Remove member from router
      tags: [Virtual Routers]
      responses:
        "200": { description: Removed }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/routers/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get virtual router status
      description: Reports health status of all member model mappings.
      tags: [Virtual Routers]
      responses:
        "200":
          description: Router status
          content:
            application/json:
              schema:
                type: object
                properties:
                  router:  { $ref: '#/components/schemas/Router' }
                  members: { type: array, items: { type: object } }
        "401": { $ref: '#/components/responses/Unauthorized' }

