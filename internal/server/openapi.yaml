  # ── API Keys ───────────────────────────────────────────────────────────────

  /api/keys:
    get:
      summary: List API keys
      tags: [API Keys]
      responses:
        "200":
          description: All API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/APIKey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create API key
      description: |
        Creates a new inference or admin API key. The full key value (`plain_key`)
        is returned **only once** — store it securely.
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyInput' }
      responses:
        "201":
          description: Created key (includes one-time `plain_key`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:       { $ref: '#/components/schemas/APIKey' }
                  plain_key: { type: string, example: "rlai_a1b2c3..." }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/keys/test:
    post:
      summary: Create temporary test key
      description: |
        Creates a short-lived (2-hour) test key for use in development/debugging.
        Expired test keys are cleaned up automatically every 2 hours.
      tags: [API Keys]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner: { type: string, default: admin }
      responses:
        "201":
          description: Test key (includes one-time `plain_key`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:       { $ref: '#/components/schemas/APIKey' }
                  plain_key: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/keys/cleanup:
    post:
      summary: Clean up expired test keys
      tags: [API Keys]
      responses:
        "200":
          description: Number of keys deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get API key
      tags: [API Keys]
      responses:
        "200":
          description: API key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      summary: Update API key
      tags: [API Keys]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyInput' }
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKey' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    delete:
      summary: Delete API key
      tags: [API Keys]
      responses:
        "200": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }

