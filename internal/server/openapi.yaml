  # ── Logs ───────────────────────────────────────────────────────────────────

  /api/logs:
    get:
      summary: List request logs
      tags: [Logs]
      parameters:
        - name: model
          in: query
          schema: { type: string }
        - name: backend_id
          in: query
          schema: { type: integer }
        - name: api_key_id
          in: query
          schema: { type: integer }
        - name: errors_only
          in: query
          schema: { type: boolean }
        - name: from
          in: query
          description: RFC3339 start time
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: RFC3339 end time
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Request logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RequestLog' }
                  total: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Events ─────────────────────────────────────────────────────────────────

  /api/events:
    get:
      summary: System event log
      tags: [Events]
      responses:
        "200":
          description: Recent system events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: integer }
                        level:      { type: string }
                        event_type: { type: string }
                        message:    { type: string }
                        metadata:   { type: object }
                        created_at: { type: string, format: date-time }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Config import/export ───────────────────────────────────────────────────

  /api/config/export:
    get:
      summary: Export full configuration
      description: Exports backends, model mappings, routing rules, and routers as JSON.
      tags: [Config]
      responses:
        "200":
          description: Configuration snapshot
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /api/config/import:
    post:
      summary: Import configuration
      description: |
        Imports a previously exported configuration. Existing resources with matching
        names are updated; new ones are created. API keys and logs are not imported.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: { type: integer }
                  updated:  { type: integer }
                  errors:   { type: array, items: { type: string } }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }

  # ── Metrics ────────────────────────────────────────────────────────────────

  /metrics:
    get:
      summary: Prometheus metrics
      description: Exposes request count, token counts, latency histograms, and backend health.
      tags: [System]
      responses:
        "200":
          description: Prometheus text format
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: '#/components/responses/Unauthorized' }

